image:
  repository: acraifactorydev08hf6.azurecr.io/ai-summarizer
  tag: "0.1.0"
replicaCount: 2
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 250m, memory: 256Mi }

service:
  type: ClusterIP
  port: 80

env:
  - name: AZURE_OPENAI_KEY
    valueFrom:
      secretKeyRef:
        name: ai-summarizer-secret
        key: AZURE_OPENAI_KEY
  - name: AZURE_OPENAI_ENDPOINT
    value: "https://aoai-ai-factory-dev.openai.azure.com/"
