apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: ai-summarizer-dev, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://github.com/VijayGodson/ai-factory-platform.git
    targetRevision: main
    path: gitops/charts/ai-summarizer
  destination: { server: https://kubernetes.default.svc, namespace: dev }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
